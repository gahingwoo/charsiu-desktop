name: Build

# Every push: the page (typecheck, tests, build, its size), lint and tests,
# screenshots of the page against a stand-in for the app, the Windows arm64
# installer (NSIS) and the Linux arm64 .deb (and an AppImage, best effort).
# A push to main puts the three on the rolling `ci` pre-release (in place,
# .github/scripts/ci-release.sh); a tag vX.Y.Z publishes them as release
# vX.Y.Z, with SHA256SUMS.txt. Names: .github/scripts/package.sh.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # pinned, so a new CLI release cannot change what gets bundled
  TAURI_CLI_VERSION: '2.12.6'
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and tests (Linux arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: The page (npm ci checks every package against package-lock.json)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: No dashes in text
        run: |
          if git grep -nP '\x{2013}|\x{2014}' -- . ':!package-lock.json'; then exit 1; fi
      - name: cargo fmt
        working-directory: src-tauri
        # the Apply rustfmt workflow (fmt.yml) fixes a failure here
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  screenshots:
    name: Screenshots of the page (Chrome, a stand-in for the app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and shoot
        run: |
          # the Chinese screenshot needs a CJK font, as Windows and Linux desktops have
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          CHROME=$(command -v google-chrome || command -v chromium) npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error
      - name: README pictures (docs/imgs, WebP)
        run: CHROME=$(command -v google-chrome || command -v chromium) npm run readme-shots
      - uses: actions/upload-artifact@v4
        with:
          name: readme-images
          path: docs/imgs/*.webp
          if-no-files-found: error

  windows:
    name: Windows arm64 installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: The page
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: tauri-cli
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked
      - name: Build
        working-directory: src-tauri
        run: cargo tauri build --target aarch64-pc-windows-msvc --bundles nsis
      - name: Check the architecture
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/charsiu-desktop.exe
          $b = [System.IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($b, 0x3c)
          $machine = [BitConverter]::ToUInt16($b, $pe + 4)
          if ($machine -ne 0xAA64) { throw ("not ARM64: machine 0x{0:X}" -f $machine) }
          Write-Host ("{0}: ARM64, {1:N0} bytes" -f $exe.Name, $exe.Length)
      - uses: actions/upload-artifact@v4
        with:
          name: charsiu-desktop-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux arm64 .deb
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: The page
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: tauri-cli
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked
      - name: Build the .deb
        working-directory: src-tauri
        run: |
          cargo tauri build --bundles deb
          for d in target/release/bundle/deb/*.deb; do dpkg-deb -I "$d"; dpkg-deb -c "$d"; done
          file target/release/charsiu-desktop
      - name: AppImage (best effort)
        id: appimage
        continue-on-error: true
        working-directory: src-tauri
        run: cargo tauri build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: charsiu-desktop-linux-arm64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.appimage.outcome == 'success'
        with:
          name: charsiu-desktop-linux-arm64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage

  ci-release:
    name: The rolling ci pre-release (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ci-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: charsiu-desktop-*
          path: built
      - name: Release names and checksums
        run: .github/scripts/package.sh built out
      - name: Update the ci pre-release in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/charsiu-desktop_*)
          .github/scripts/ci-release.sh '^charsiu-desktop_' "${files[@]}"

  release:
    name: Release vX.Y.Z (tags)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: charsiu-desktop-*
          path: built
      - name: Release names and checksums
        id: pkg
        run: .github/scripts/package.sh built out
      - name: The tag is the version
        run: |
          tag=${GITHUB_REF_NAME}
          [ "$tag" = "v${{ steps.pkg.outputs.version }}" ] \
            || { echo "tag $tag but package.json says ${{ steps.pkg.outputs.version }}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME}
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # a release made by hand first: add and replace, never delete it
            gh release upload "$tag" out/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "Charsiu Desktop ${tag#v}" --generate-notes
          fi
