<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>charsiu</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="vendor/patternfly.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-labelledby="convHead">
    <div class="side-head">
      <h2 id="convHead" class="side-title" data-i18n="conv.list">Conversations</h2>
      <button type="button" class="pf-v6-c-button pf-m-secondary pf-m-small" id="newConv"><span class="pf-v6-c-button__text" data-i18n="conv.new">New conversation</span></button>
    </div>
    <ul class="conv-list" id="convList"></ul>
  </aside>

  <main class="main">
    <header class="bar">
      <h1 class="bar-title" id="convTitle">charsiu</h1>
      <div class="bar-actions">
        <label class="pf-v6-screen-reader" for="modelSelect" data-i18n="bar.model">Model</label>
        <span class="pf-v6-c-form-control model-select">
          <select id="modelSelect"></select>
          <span class="pf-v6-c-form-control__utilities"><span class="pf-v6-c-form-control__toggle-icon"><svg class="pf-v6-svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" width="1em" height="1em"><path d="M31.3 192h257.3c17.8 0 26.7 21.5 14.1 34.1L174.1 354.8c-7.8 7.8-20.5 7.8-28.3 0L17.2 226.1C4.6 213.5 13.5 192 31.3 192z"/></svg></span></span>
        </span>
        <button type="button" class="pf-v6-c-button pf-m-link" id="openModels"><span class="pf-v6-c-button__text" data-i18n="bar.models">Models</span></button>
        <button type="button" class="pf-v6-c-button pf-m-link" id="openSettings"><span class="pf-v6-c-button__text" data-i18n="bar.settings">Settings</span></button>
      </div>
    </header>

    <div class="notices" id="notices" aria-live="polite"></div>

    <section class="chat pf-v6-c-card" id="chatCard">
      <div class="chat-scroll" id="chatScroll">
        <div class="messages" id="messages"></div>
      </div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <span class="pf-v6-c-form-control pf-m-textarea pf-m-resize-vertical">
        <textarea id="input" rows="3" data-i18n-placeholder="chat.placeholder" aria-label="Message"></textarea>
      </span>
      <div class="composer-actions">
        <button type="button" class="pf-v6-c-button pf-m-link" id="clearConv"><span class="pf-v6-c-button__text" data-i18n="chat.clear">Clear conversation</span></button>
        <button type="submit" class="pf-v6-c-button pf-m-primary" id="send"><span class="pf-v6-c-button__text" data-i18n="chat.send">Send</span></button>
      </div>
    </form>

    <footer class="status" id="status">
      <span class="status-item"><span class="status-key" data-i18n="status.backend">Backend</span> <span id="stBackend"></span></span>
      <span class="status-item"><span class="status-key" data-i18n="status.model">Model</span> <span id="stModel"></span></span>
      <span class="status-item"><span class="status-key" data-i18n="status.npu">NPU</span> <span id="stNpu"></span></span>
      <span class="status-item"><span class="status-key" data-i18n="status.speed">Last reply</span> <span id="stSpeed">-</span></span>
      <button type="button" class="pf-v6-c-button pf-m-link pf-m-inline" id="openLog"><span class="pf-v6-c-button__text" data-i18n="status.log">Log</span></button>
    </footer>
  </main>
</div>

<!-- Models -->
<div class="pf-v6-c-backdrop" id="modelsModal" hidden>
  <div class="pf-v6-l-bullseye">
    <div class="pf-v6-c-modal-box pf-m-lg" role="dialog" aria-modal="true" aria-labelledby="modelsTitle">
      <div class="pf-v6-c-modal-box__close">
        <button type="button" class="pf-v6-c-button pf-m-plain" data-close data-i18n-title="common.close"><span class="pf-v6-c-button__icon"><svg class="pf-v6-svg" viewBox="0 0 352 512" fill="currentColor" aria-hidden="true" width="1em" height="1em"><path d="M242.7 256l100.1-100.1c12.3-12.3 12.3-32.2 0-44.5l-22.2-22.2c-12.3-12.3-32.2-12.3-44.5 0L176 189.3 75.9 89.2c-12.3-12.3-32.2-12.3-44.5 0L9.2 111.4c-12.3 12.3-12.3 32.2 0 44.5L109.3 256 9.2 356.1c-12.3 12.3-12.3 32.2 0 44.5l22.2 22.2c12.3 12.3 32.2 12.3 44.5 0L176 322.7l100.1 100.1c12.3 12.3 32.2 12.3 44.5 0l22.2-22.2c12.3-12.3 12.3-32.2 0-44.5L242.7 256z"/></svg></span></button>
      </div>
      <header class="pf-v6-c-modal-box__header">
        <h1 class="pf-v6-c-modal-box__title" id="modelsTitle" data-i18n="models.title">Models</h1>
      </header>
      <div class="pf-v6-c-modal-box__body" id="modelsBody"></div>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="pf-v6-c-backdrop" id="settingsModal" hidden>
  <div class="pf-v6-l-bullseye">
    <div class="pf-v6-c-modal-box pf-m-md" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="pf-v6-c-modal-box__header">
        <h1 class="pf-v6-c-modal-box__title" id="settingsTitle" data-i18n="settings.title">Settings</h1>
      </header>
      <div class="pf-v6-c-modal-box__body">
        <form class="pf-v6-c-form" id="settingsForm" novalidate>
          <div class="pf-v6-c-form__group">
            <div class="pf-v6-c-form__group-label"><label class="pf-v6-c-form__label" for="setTemp"><span class="pf-v6-c-form__label-text" data-i18n="settings.temperature">Temperature</span></label></div>
            <div class="pf-v6-c-form__group-control">
              <span class="pf-v6-c-form-control"><input type="number" id="setTemp" min="0" max="2" step="0.1"></span>
              <div class="pf-v6-c-form__helper-text"><div class="pf-v6-c-helper-text"><div class="pf-v6-c-helper-text__item"><span class="pf-v6-c-helper-text__item-text" data-i18n="settings.temperatureHelp"></span></div></div></div>
            </div>
          </div>
          <div class="pf-v6-c-form__group">
            <div class="pf-v6-c-form__group-label"><label class="pf-v6-c-form__label" for="setMax"><span class="pf-v6-c-form__label-text" data-i18n="settings.maxTokens">Maximum reply length</span></label></div>
            <div class="pf-v6-c-form__group-control"><span class="pf-v6-c-form-control"><input type="number" id="setMax" min="1" max="4096" step="1"></span></div>
          </div>
          <div class="pf-v6-c-form__group">
            <div class="pf-v6-c-form__group-label"><label class="pf-v6-c-form__label" for="setSystem"><span class="pf-v6-c-form__label-text" data-i18n="settings.system">System prompt</span></label></div>
            <div class="pf-v6-c-form__group-control">
              <span class="pf-v6-c-form-control pf-m-textarea pf-m-resize-vertical"><textarea id="setSystem" rows="3"></textarea></span>
              <div class="pf-v6-c-form__helper-text"><div class="pf-v6-c-helper-text"><div class="pf-v6-c-helper-text__item"><span class="pf-v6-c-helper-text__item-text" data-i18n="settings.systemHelp"></span></div></div></div>
            </div>
          </div>
          <div class="pf-v6-c-form__group">
            <div class="pf-v6-c-form__group-label"><label class="pf-v6-c-form__label" for="setLang"><span class="pf-v6-c-form__label-text" data-i18n="settings.language">Language</span></label></div>
            <div class="pf-v6-c-form__group-control">
              <span class="pf-v6-c-form-control">
                <select id="setLang">
                  <option value="" data-i18n="settings.langAuto">Follow the system</option>
                  <option value="en">English</option>
                  <option value="zh-CN">简体中文</option>
                </select>
                <span class="pf-v6-c-form-control__utilities"><span class="pf-v6-c-form-control__toggle-icon"><svg class="pf-v6-svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" width="1em" height="1em"><path d="M31.3 192h257.3c17.8 0 26.7 21.5 14.1 34.1L174.1 354.8c-7.8 7.8-20.5 7.8-28.3 0L17.2 226.1C4.6 213.5 13.5 192 31.3 192z"/></svg></span></span>
              </span>
            </div>
          </div>
          <div class="pf-v6-c-form__group">
            <div class="pf-v6-c-form__group-label"><label class="pf-v6-c-form__label" for="setTheme"><span class="pf-v6-c-form__label-text" data-i18n="settings.theme">Theme</span></label></div>
            <div class="pf-v6-c-form__group-control">
              <span class="pf-v6-c-form-control">
                <select id="setTheme">
                  <option value="system" data-i18n="settings.themeSystem">Follow the system</option>
                  <option value="light" data-i18n="settings.themeLight">Light</option>
                  <option value="dark" data-i18n="settings.themeDark">Dark</option>
                </select>
                <span class="pf-v6-c-form-control__utilities"><span class="pf-v6-c-form-control__toggle-icon"><svg class="pf-v6-svg" viewBox="0 0 320 512" fill="currentColor" aria-hidden="true" width="1em" height="1em"><path d="M31.3 192h257.3c17.8 0 26.7 21.5 14.1 34.1L174.1 354.8c-7.8 7.8-20.5 7.8-28.3 0L17.2 226.1C4.6 213.5 13.5 192 31.3 192z"/></svg></span></span>
              </span>
            </div>
          </div>
          <div class="pf-v6-c-form__group">
            <div class="pf-v6-c-form__group-label"><label class="pf-v6-c-form__label" for="setCharsiu"><span class="pf-v6-c-form__label-text" data-i18n="settings.charsiu">charsiu program</span></label></div>
            <div class="pf-v6-c-form__group-control">
              <span class="pf-v6-c-form-control"><input type="text" id="setCharsiu" spellcheck="false"></span>
              <div class="pf-v6-c-form__helper-text"><div class="pf-v6-c-helper-text"><div class="pf-v6-c-helper-text__item"><span class="pf-v6-c-helper-text__item-text" id="setCharsiuHelp"></span></div></div></div>
            </div>
          </div>
        </form>
      </div>
      <footer class="pf-v6-c-modal-box__footer">
        <button type="submit" form="settingsForm" class="pf-v6-c-button pf-m-primary"><span class="pf-v6-c-button__text" data-i18n="settings.save">Save</span></button>
        <button type="button" class="pf-v6-c-button pf-m-link" data-close><span class="pf-v6-c-button__text" data-i18n="settings.cancel">Cancel</span></button>
      </footer>
    </div>
  </div>
</div>

<!-- Log -->
<div class="pf-v6-c-backdrop" id="logModal" hidden>
  <div class="pf-v6-l-bullseye">
    <div class="pf-v6-c-modal-box pf-m-lg" role="dialog" aria-modal="true" aria-labelledby="logTitle">
      <header class="pf-v6-c-modal-box__header">
        <h1 class="pf-v6-c-modal-box__title" id="logTitle" data-i18n="log.title">Backend log</h1>
      </header>
      <div class="pf-v6-c-modal-box__body"><pre class="log" id="logText"></pre></div>
      <footer class="pf-v6-c-modal-box__footer">
        <button type="button" class="pf-v6-c-button pf-m-secondary" data-close><span class="pf-v6-c-button__text" data-i18n="common.close">Close</span></button>
      </footer>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
