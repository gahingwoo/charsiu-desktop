[package]
name = "charsiu-desktop"
version = "0.1.0"
description = "A chat window for charsiu, the open LLM runtime for the RK3576 NPU"
authors = ["gahingwoo <gahing@gahingwoo.com>"]
license = "GPL-2.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "charsiu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
# the board has 4 GB and a slow card: small beats fast here
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
